[bundle]
name = "ticket-workflow"
schema_version = "1"
summary = "/work-ticket (ticket → governed MR/PR, stacked delivery) and /create-ticket (one drafted ticket or issue)"
description = """
Two skills on top of a tracker bundle and an SCM bundle. `/work-ticket KEY|#N` verifies the
ticket against the code, sizes it, gates every tracker write behind the agent-worked label,
implements on key-free branches (subagents in local worktrees), runs only the checks CI lacks
and opens MRs/PRs that mention the key without closing it; large tickets are planned by the
Plan agent and delivered as stacked MRs/PRs. `/create-ticket <text>` renders ONE ticket or
GitHub issue deterministically (render-ticket.py), creates it with the agent-drafted label,
reads it back and stops. Works with Jira + GitLab, Jira + GitHub, or GitHub alone; the skills
check the CLI they need at preflight and name the missing bundle instead of improvising.
Org-specific issue-type rules and field ids come from jira.issue_types / jira.fields.
"""
depends_on = ["core"]
recommends = ["jira", "gitlab", "github", "stack", "lessons"]
conflicts_with = []
any_of = [["jira", "github"], ["gitlab", "github"]]
owners = []
docs = "docs/bundles/ticket-workflow.md"
stability = "beta"

[requires.binaries.jq]
min_version = "1.6"
version_cmd = "jq --version"
version_regex = 'jq-([0-9]+\.[0-9]+)'
why = "Every preflight / facts script emits JSON through jq."

[requires.binaries.python3]
min_version = "3.9"
version_cmd = "python3 --version"
version_regex = 'Python ([0-9]+\.[0-9]+)'
why = "render-ticket.py and the preflight helpers."

[requires.binaries.git]
min_version = "2.30"
version_cmd = "git --version"
version_regex = 'git version ([0-9]+\.[0-9]+)'
why = "Worktrees for subagents, branch facts, stacked delivery."

[requires.config."ticket_workflow.trackers"]
type = "array"
default = []
description = "Which tracker each repository uses, by origin remote: [[ticket_workflow.trackers]] match (ERE on <host>/<path>, case-insensitive), tracker (github-issues or jira), project (jira only: create-ticket's default project). First match wins; a repository's .harness.toml [repo] tracker wins over it; no match = the host decides (github.com -> github-issues, GitLab -> jira)."
examples = [[{ match = "^github\\.com/owner/", tracker = "github-issues" }, { match = "^gitlab\\.example\\.com/group/", tracker = "jira", project = "PROJ" }]]

[requires.config."ticket_workflow.trackers".items]
type = "object"
additionalProperties = false
required = ["match", "tracker"]
properties = { match = { type = "string", minLength = 1, description = "ERE on <host>/<path> of origin (lower-case host, no scheme, credentials, port or .git)" }, tracker = { type = "string", enum = ["github-issues", "jira"] }, project = { type = "string", pattern = "^[A-Z][A-Z0-9_]*$", description = "Default Jira project key for create-ticket (tracker = jira only)" } }
anyOf = [{ not = { required = ["project"] } }, { properties = { tracker = { const = "jira" } } }]

[provides]
rules = ["rules/75-ticket-workflow.md"]
skills = ["skills/work-ticket", "skills/create-ticket"]
skill_fragments = []
agents = []
guard_rules = ["guard.d/75-ticket-workflow.sh"]
permissions = "permissions.toml"
mcp = ""
bin = []

[provides.env]

[[manual_steps]]
id = "repo-overrides"
title = "Know how a repository yields and overrides (read once)"
once_per = "org"
needs = []
minutes = 2
why = "The hub is a user-level baseline (principle 8): a repository that owns its ticket workflow replaces these skills wholesale, and a few guard behaviours can be switched per repository, never globally."
how = """
In the repository's `.harness.toml` (provider-neutral, committed; `harness repo` shows the effect):
- `[owns] domains = ["delivery"]` — this repository runs its own ticket → MR/PR workflow;
  `/work-ticket` and `/create-ticket` stop after their read-only preflight and hand over.
- `[overrides] WORK_TICKET_ALLOW_TRANSITION = "1"` — a transition / close / reopen on a
  human ticket asks instead of denying.
- `[overrides] WORK_TICKET_KEY_IN_BRANCH = "1"` — the repository puts ticket keys in branch
  names and commit subjects: the guard lets key-named branches and key-prefixed subjects
  pass instead of asking.
- `[overrides] WORK_TICKET_ALLOW_DEFAULT_PUSH_RE = "<regex>"` — a default-branch push asks
  instead of denying (personal repositories).
A provider `env` override (Claude Code: `.claude/settings.json` → `"env"`) of the same name
wins per key. A repository workflow skill is also detected at preflight by its description.
Full list and the credential exemption: docs/repo-level.md.
"""
[manual_steps.verify]
cmd = "true"
expect = { exit = 0 }

[[doctor_checks]]
id = "ticket-workflow-tracker"
title = "A tracker CLI is on PATH (jira or gh)"
severity = "fail"
cmd = "command -v jira >/dev/null 2>&1 || command -v gh >/dev/null 2>&1"
expect = { exit = 0 }
offline_skip = false
fix = "Activate the jira or github bundle (hub.bundles) and run harness apply"

[[doctor_checks]]
id = "ticket-workflow-scm"
title = "An SCM CLI is on PATH (glab or gh)"
severity = "fail"
cmd = "command -v glab >/dev/null 2>&1 || command -v gh >/dev/null 2>&1"
expect = { exit = 0 }
offline_skip = false
fix = "Activate the gitlab or github bundle (hub.bundles) and run harness apply"

[[doctor_checks]]
id = "ticket-workflow-skills"
title = "work-ticket and create-ticket skills rendered"
severity = "fail"
cmd = "test -s ~/.claude/skills/work-ticket/SKILL.md && test -s ~/.claude/skills/create-ticket/SKILL.md"
expect = { exit = 0 }
offline_skip = false
fix = "harness apply --provider claude"
providers = ["claude"]

[[doctor_checks]]
id = "ticket-workflow-trackers"
title = "ticket_workflow.trackers entries are valid (match compiles, tracker known, project only with jira)"
severity = "fail"
cmd = '''bash "${HARNESS_HOME:-$HOME/harness-hub}/bundles/ticket-workflow/lib/check-trackers.sh" <<'HARNESS_TRACKERS'
[{{ ticket_workflow.trackers }}]
HARNESS_TRACKERS'''
expect = { exit = 0 }
offline_skip = false
fix = "Edit [[ticket_workflow.trackers]] in harness.toml at the index named above: match is an ERE on <host>/<path> (escape dots), tracker is github-issues or jira, project only with jira; then harness doctor"

[uninstall]
keeps = []
notes = "Removes the two rendered skills and the rule block; tickets, MRs and labels they created are untouched."

# Component taxonomy (docs/reference/taxonomy.md): bundle defaults, then per-component overrides.
[taxonomy]
domain = "delivery"
posture = "label-gated"
function = "workflow"

# Guides steer the agent before it acts; sensors detect at or after the action (principle 6).
[harness]
coverage_note = "The size rubric, Q-checklist and MR body content are judgement calls (inferential: code-reviewer); SCM verb conventions are sensed by the gitlab/github guard sections; the preflight and facts scripts are sensed by golden suites against stubbed gh, glab and jira."
guides = [
  { kind = "rule", ref = "rules/75-ticket-workflow.md", checks = ["guard.d/75-ticket-workflow.sh", "doctor_checks", "skills/work-ticket/scripts/tests/run.sh"], note = "ticket to MR/PR flow, label gate, key-free branches, stacked delivery; the tracker is declared per repository (sensed by the work-ticket golden suite and the ticket-workflow-trackers doctor check)" },
  { kind = "skill", ref = "skills/work-ticket", checks = ["guard.d/75-ticket-workflow.sh", "skills/work-ticket/scripts/tests/run.sh"], note = "the governed ticket workflow and its preflight scripts; Step 8 runs the retro skill only when harness lessons review is due (lessons bundle)" },
  { kind = "skill", ref = "skills/create-ticket", checks = ["skills/create-ticket/scripts/tests/run.sh"], note = "one drafted ticket or issue, rendered deterministically; Step 9 runs the retro skill only when harness lessons review is due (lessons bundle)" },
]
sensors = [
  { kind = "guard", ref = "guard.d/75-ticket-workflow.sh", note = "key-free branches and subjects, sub worktree paths, squash delivery" },
  { kind = "doctor", ref = "doctor_checks", note = "a tracker CLI and an SCM CLI on PATH, both skills rendered" },
  { kind = "doctor", ref = "ticket-workflow-trackers", note = "every ticket_workflow.trackers match compiles, tracker is known, project only with jira" },
  { kind = "test", ref = "tests/run.sh", note = "this bundle's guard rows against core + ticket-workflow only, then every skill suite, then the ticket-workflow-trackers doctor script (lib/check-trackers.sh) per input" },
  { kind = "test", ref = "guard.d/tests.sh", note = "rows for section 75 incl. bypasses" },
  { kind = "test", ref = "skills/work-ticket/scripts/tests/run.sh", note = "preflight dispatch, GitHub and GitLab preflights, issue and Jira facts, repo-facts incl. the rf-tracker table (repo > config > host): one JSON object per run, goldens per fixture repository with and without PyYAML, read-only stub-log invariants" },
  { kind = "test", ref = "skills/create-ticket/scripts/tests/run.sh", note = "golden renders of every ticket class; create-facts goldens for Jira and GitHub (config, unreachable, unauthenticated, not installed, GitHub Enterprise templates, --repo tracker); the inlined rf_tracker block matches work-ticket's" },
]
