{
  "name": "ci",
  "on": {
    "pull_request": {"paths-ignore": ["docs/**"]},
    "push": {"branches-ignore": ["*-sub-*"]}
  },
  "jobs": {
    "lint": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "pre-commit run --all-files"}]},
    "test": {"runs-on": "ubuntu-latest", "steps": [{"run": "pytest -q"}]},
    "image": {"uses": "./.github/workflows/build.yml"},
    "deploy": {"if": "github.event_name == 'push'", "runs-on": "ubuntu-latest", "environment": "staging",
               "steps": [{"run": "echo deploy"}]},
    "release": {"if": "startsWith(github.ref, 'refs/tags/')", "runs-on": "ubuntu-latest",
                "steps": [{"uses": "goreleaser/goreleaser-action@v6"}]}
  }
}
