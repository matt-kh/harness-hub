# Claude Code permission rules contributed by bundle `core` (merged into settings.json
# `permissions` by the claude provider; other providers translate what they can).
# git reads, an ask on every write to a repository's .harness.toml (principle 8: the declaration lifts
# user-level rules, so the user reviews it; this list never yields), plus every credential-file Read deny (defence in depth: the files stay denied even when the tool's bundle is not installed; the guard's 20-credentials section covers the Bash side).

[permissions]
allow = [
  "Bash(git worktree list:*)",
]
ask = [
  "Write(**/.harness.toml)",
  "Edit(**/.harness.toml)",
]
deny = [
  "Read(~/.kube/**)",
  "Read(~/.config/jira)",
  "Read(~/.config/glab-cli/**)",
  "Read(~/.config/gdoc/**)",
  "Read(~/.config/gh/**)",
  "Read(~/.claude/.credentials.json)",
  "Read(~/.claude/remote-settings.json)",
  "Read(~/.aws/**)",
  "Read(~/.ssh/**)",
  "Read(**/.env)",
  "Read(**/.env.*)",
]
