# Defaults for bundle `core` (lowest layer; override in local/harness.toml).

[core]
default_branch_re = "^(master|main)$"
ticket_example = "PROJ-123"
model_policy = { plan = "fable", execute = "opus" }
agent_labels = { worked = "agent-worked", created = "agent-created", drafted = "agent-drafted" }
agent_label_re = "^agent-"

[credentials]
extra_paths_re = ""

[lessons]
journal = false
prompt_signals = false
# Basic strings: the correction regex contains a quote; backslashes would need doubling.
correction_re = "^(no([,.!]|$| (that|this|it|you|i|not|wait|stop)([ ,.!']|$))|nope|wrong|incorrect|that'?s not|not what i|i (said|asked|meant|told you|wanted)|you (didn'?t|did not|ignored|missed|forgot|broke|changed)|undo|revert (that|this|it)|redo|try again|again[,.!]?$|still (wrong|broken|failing|not))"
dissatisfaction_re = "(frustrat|annoy|unacceptable|stop (doing|that)|why (did|do|are) you|don'?t (do (that|this)|ever)|you keep|this is (wrong|bad|useless))"
dir = ""
promote_after = 3
max_age_days = 90
index_max = 40
index_max_candidates = 5

[lessons.review]
corrections = 2
dissatisfaction = 1
denies = 3
