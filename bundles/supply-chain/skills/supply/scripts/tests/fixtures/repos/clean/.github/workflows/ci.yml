name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: node:20.18.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
      - uses: ./.github/actions/local
      - name: install
        run: npm ci
      - name: audit
        run: |
          npm audit --audit-level=high
          echo "::add-mask::${{ secrets.NPM_TOKEN }}"
