# Claude Code permission rules contributed by bundle `provision` (merged into settings.json
# `permissions` by the claude provider; other providers translate what they can).
# prov (also `uv run --frozen prov`, a project-pinned prov that never re-locks) and the read
# forms of the provisioning tools allowed, apply steps ask, the human-managed kubeconfig and
# talosconfig denied (the guard's 85-provision section is the authoritative check: it also
# unwraps sudo, sh -c, xargs, nix run and uv run / uvx, and judges flags such as --dry-run and
# --target-host, which no prefix rule can).

[permissions]
allow = [
  "Bash(nix flake check:*)",
  "Bash(nix flake show:*)",
  "Bash(prov:*)",
  "Bash(pvesh get:*)",
  "Bash(qm config:*)",
  "Bash(qm list:*)",
  "Bash(talosctl config info:*)",
  "Bash(talosctl validate:*)",
  "Bash(talosctl version:*)",
  "Bash(uv run --frozen prov:*)",
  "Bash(virsh dominfo:*)",
  "Bash(virsh list:*)",
]
ask = [
  "Bash(nixos-rebuild switch:*)",
  "Bash(pct create:*)",
  "Bash(pct destroy:*)",
  "Bash(pvesh create:*)",
  "Bash(pvesh delete:*)",
  "Bash(pvesh set:*)",
  "Bash(qm create:*)",
  "Bash(qm destroy:*)",
  "Bash(qm set:*)",
  "Bash(talosctl apply-config:*)",
  "Bash(talosctl bootstrap:*)",
  "Bash(talosctl reset:*)",
  "Bash(talosctl upgrade:*)",
  "Bash(virsh destroy:*)",
  "Bash(virsh undefine:*)",
]
deny = [
  "Bash(talosctl config merge:*)",
  "Bash(talosctl kubeconfig:*)",
]
