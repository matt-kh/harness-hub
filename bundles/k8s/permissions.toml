# Claude Code permission rules contributed by bundle `k8s` (merged into settings.json
# `permissions` by the claude provider; other providers translate what they can).
# kubectl/helm/argocd/pulumi/terraform reads allowed, mutations ask, kubeconfig edits denied (the guard's 25-k8s-rules section is the authoritative check).

[permissions]
allow = [
  "Bash(argocd app diff:*)",
  "Bash(argocd app get:*)",
  "Bash(argocd app list:*)",
  "Bash(helm dependency:*)",
  "Bash(helm env:*)",
  "Bash(helm get hooks:*)",
  "Bash(helm get metadata:*)",
  "Bash(helm get notes:*)",
  "Bash(helm history:*)",
  "Bash(helm lint:*)",
  "Bash(helm list:*)",
  "Bash(helm repo list:*)",
  "Bash(helm search:*)",
  "Bash(helm show:*)",
  "Bash(helm status:*)",
  "Bash(helm template:*)",
  "Bash(helm version:*)",
  "Bash(k8s:*)",
  "Bash(kubectl api-resources:*)",
  "Bash(kubectl api-versions:*)",
  "Bash(kubectl auth can-i:*)",
  "Bash(kubectl auth whoami:*)",
  "Bash(kubectl cluster-info:*)",
  "Bash(kubectl config current-context:*)",
  "Bash(kubectl config get-clusters:*)",
  "Bash(kubectl config get-contexts:*)",
  "Bash(kubectl config get-users:*)",
  "Bash(kubectl config view:*)",
  "Bash(kubectl describe:*)",
  "Bash(kubectl diff:*)",
  "Bash(kubectl events:*)",
  "Bash(kubectl explain:*)",
  "Bash(kubectl get:*)",
  "Bash(kubectl kustomize:*)",
  "Bash(kubectl logs:*)",
  "Bash(kubectl rollout history:*)",
  "Bash(kubectl rollout status:*)",
  "Bash(kubectl top:*)",
  "Bash(kubectl version:*)",
  "Bash(kubectl wait:*)",
  "Bash(pulumi preview:*)",
  "Bash(pulumi stack ls:*)",
]
ask = [
  "Bash(argocd app delete:*)",
  "Bash(argocd app sync:*)",
  "Bash(helm get all:*)",
  "Bash(helm get manifest:*)",
  "Bash(helm get values:*)",
  "Bash(helm install:*)",
  "Bash(helm push:*)",
  "Bash(helm rollback:*)",
  "Bash(helm test:*)",
  "Bash(helm uninstall:*)",
  "Bash(helm upgrade:*)",
  "Bash(kubectl annotate:*)",
  "Bash(kubectl apply:*)",
  "Bash(kubectl attach:*)",
  "Bash(kubectl auth reconcile:*)",
  "Bash(kubectl autoscale:*)",
  "Bash(kubectl certificate:*)",
  "Bash(kubectl cordon:*)",
  "Bash(kubectl cp:*)",
  "Bash(kubectl create:*)",
  "Bash(kubectl debug:*)",
  "Bash(kubectl delete:*)",
  "Bash(kubectl drain:*)",
  "Bash(kubectl edit:*)",
  "Bash(kubectl exec:*)",
  "Bash(kubectl expose:*)",
  "Bash(kubectl label:*)",
  "Bash(kubectl patch:*)",
  "Bash(kubectl port-forward:*)",
  "Bash(kubectl proxy:*)",
  "Bash(kubectl replace:*)",
  "Bash(kubectl rollout pause:*)",
  "Bash(kubectl rollout restart:*)",
  "Bash(kubectl rollout resume:*)",
  "Bash(kubectl rollout undo:*)",
  "Bash(kubectl run:*)",
  "Bash(kubectl scale:*)",
  "Bash(kubectl set:*)",
  "Bash(kubectl taint:*)",
  "Bash(kubectl uncordon:*)",
  "Bash(pulumi destroy:*)",
  "Bash(pulumi refresh:*)",
  "Bash(pulumi up:*)",
  "Bash(terraform apply:*)",
  "Bash(terraform destroy:*)",
]
deny = [
  "Bash(aws eks update-kubeconfig:*)",
  "Bash(eksctl utils write-kubeconfig:*)",
  "Bash(kubectl config delete-cluster:*)",
  "Bash(kubectl config delete-context:*)",
  "Bash(kubectl config delete-user:*)",
  "Bash(kubectl config rename-context:*)",
  "Bash(kubectl config set-cluster:*)",
  "Bash(kubectl config set-context:*)",
  "Bash(kubectl config set-credentials:*)",
  "Bash(kubectl config set:*)",
  "Bash(kubectl config unset:*)",
  "Bash(kubectl config use-context:*)",
]
