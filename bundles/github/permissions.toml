  "Bash(gh gist rename:*)",
  "Bash(gh gpg-key add:*)",
  "Bash(gh gpg-key delete:*)",
  "Bash(gh issue delete:*)",
  "Bash(gh issue develop:*)",
  "Bash(gh issue lock:*)",
  "Bash(gh issue pin:*)",
  "Bash(gh issue transfer:*)",
