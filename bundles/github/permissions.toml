# Claude Code permission rules contributed by bundle `github` (merged into settings.json
# `permissions` by the claude provider; other providers translate what they can).
# gh reads allowed, team-visible writes ask, token output denied (the guard's 41/60 sections gate the rest).

[permissions]
allow = [
  "Bash(gh api:*)",
  "Bash(gh auth status:*)",
  "Bash(gh cache list:*)",
  "Bash(gh issue list:*)",
  "Bash(gh issue status:*)",
  "Bash(gh issue view:*)",
  "Bash(gh label list:*)",
  "Bash(gh pr checkout:*)",
  "Bash(gh pr checks:*)",
  "Bash(gh pr diff:*)",
  "Bash(gh pr list:*)",
  "Bash(gh pr status:*)",
  "Bash(gh pr view:*)",
  "Bash(gh release download:*)",
  "Bash(gh release list:*)",
  "Bash(gh release view:*)",
  "Bash(gh repo clone:*)",
  "Bash(gh repo list:*)",
  "Bash(gh repo set-default:*)",
  "Bash(gh repo view:*)",
  "Bash(gh ruleset:*)",
  "Bash(gh run download:*)",
  "Bash(gh run list:*)",
  "Bash(gh run view:*)",
  "Bash(gh run watch:*)",
  "Bash(gh search:*)",
  "Bash(gh secret list:*)",
  "Bash(gh status:*)",
  "Bash(gh variable get:*)",
  "Bash(gh variable list:*)",
  "Bash(gh workflow list:*)",
  "Bash(gh workflow view:*)",
]
ask = [
  "Bash(gh alias delete:*)",
