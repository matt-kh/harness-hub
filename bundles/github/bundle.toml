[bundle]
name = "github"
schema_version = "1"
summary = "GitHub CLI, PR-based workflow, GitHub Issues as the tracker, gh governance rules"
description = """
Installs `gh` (checksum-verified, no sudo), wires the guard rules for gh (token output deny,
GitHub closing-keyword deny except the PR to the default branch closing its agent-worked issue
in a repository whose tracker is GitHub Issues, merge/review and human PR/issue state ask, subagent deny of
merges and state changes, API writes ask, label gate on PR/issue writes, stacked-PR rules) and adds the GitHub section of the instructions and
the gh read permissions. The ticket-workflow skills drive GitHub Issues → PRs when this bundle
is active.
"""
depends_on = ["core"]
recommends = ["ticket-workflow"]
conflicts_with = []
any_of = []
owners = []
docs = "docs/bundles/github.md"
stability = "stable"

[requires.binaries.gh]
min_version = "2.60.0"
version_cmd = "gh --version"
version_regex = 'gh version ([0-9]+\.[0-9]+\.[0-9]+)'
install = "gh"
why = "PR/issue reads, gated writes, auth status; the work-ticket GitHub preflight."

[requires.binaries.ssh]
min_version = "0"
version_cmd = "ssh -V"
optional = true
why = "git remotes stay SSH; gh never gets git credentials."

[requires.config."github.host"]
type = "string"
default = "github.com"
pattern = '^[a-z0-9.-]+$'
description = "GitHub host: github.com or your GHES hostname."

[requires.config."github.login"]
type = "string"
required = true
pattern = '^[A-Za-z0-9-]+$'
description = "Your GitHub login. Shown in the instructions; repos you own are trusted in the provider's auto-mode trust text."
example = "octocat"

[requires.config."github.pr_title_forbid_re"]
type = "string"
default = "#[0-9]+"
description = "ERE a PR title must NOT match (issue refs belong in the body); empty disables. HARNESS_GITHUB_PR_TITLE_FORBID_RE."
example = "#[0-9]+|WIP"

[requires.config."github.close_issue_on_merge"]
type = "boolean"
default = true
description = "In a repository whose tracker is GitHub Issues (.harness.toml [repo] tracker, else the first matching ticket_workflow.trackers entry, else a github.com origin), let the PR to the default branch carry a closing keyword for its agent-worked issue(s) (#N only) so GitHub closes them when a human merges it; false denies it like every other closing keyword. HARNESS_GITHUB_CLOSE_ISSUE_ON_MERGE."
[requires.config."github.stack_extension_version"]
type = "string"
default = "0.3.0"
pattern = '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\Z'
description = "Version of the github/gh-stack extension the guard and the skills are written against (no leading v). The human installs it with --pin v<this>; doctor and the work-ticket preflight compare the installed one against it. HARNESS_GITHUB_STACK_EXT_VERSION."
example = "0.3.0"

[requires.secrets.gh_token]
where = "~/.config/gh/hosts.yml"
written_by = "gh auth login"
mode = "0600"
description = "OAuth token / PAT stored by gh. The hub never reads or writes it; the guard denies agents reading it and `gh auth token`."
rotate = "docs/runbooks/rotate-github-token.md"

[provides]
rules = ["rules/60-github.md"]
skills = []
skill_fragments = []
agents = []
guard_rules = ["guard.d/41-github-closing.sh", "guard.d/60-github.sh"]
permissions = "permissions.toml"
mcp = ""
bin = []

[provides.env]
WORK_TICKET_GH = "gh"
HARNESS_GITHUB_PR_TITLE_FORBID_RE = "{{ github.pr_title_forbid_re }}"
HARNESS_GITHUB_CLOSE_ISSUE_ON_MERGE = "{{ github.close_issue_on_merge }}"
HARNESS_GITHUB_STACK_EXT_VERSION = "{{ github.stack_extension_version }}"

[[manual_steps]]
id = "install-gh"
title = "Install the GitHub CLI"
once_per = "machine"
needs = []
minutes = 1
why = "No sudo is assumed; the hub installs a pinned, sha256-verified release into ~/.local/bin."
how = """
Run: `harness install gh`
Air-gapped: download `gh_<ver>_<os>_<arch>.tar.gz` (macOS: `.zip`) of the version in
`tools/gh.lock.json` on a connected machine, then
`harness install gh --from /path/to/gh_<ver>_<os>_<arch>.tar.gz`.
Package managers work too (`brew install gh`, the official apt repo) — any gh >= 2.60 on PATH.
"""
[manual_steps.verify]
cmd = "gh --version"
expect = { exit = 0 }
unblocks = ["gh-binary"]

[[manual_steps]]
id = "gh-auth"
title = "Authenticate gh (browser device flow, PAT fallback)"
once_per = "account"
needs = ["browser"]
minutes = 3
why = "Agents never run `gh auth login`; the token is yours and stays in ~/.config/gh/hosts.yml."
how = """
1. In a terminal (inside Claude Code type `! ` first):
   `gh auth login --hostname {{ github.host }} --git-protocol ssh --web`
2. Choose **SSH** as the git protocol, then **Login with a web browser**; copy the one-time code,
   open the URL, paste it, **Authorize**.
3. If the device flow fails (SSO, proxy, WSL without a browser): create a classic PAT at
   https://{{ github.host }}/settings/tokens → **Generate new token (classic)** with scopes
   `repo`, `read:org`, `workflow`, `admin:public_key`, save it to a file, run
   `gh auth login --hostname {{ github.host }} --git-protocol ssh --with-token < token.txt`
   and delete the file.
4. `gh auth setup-git` is NOT needed — remotes are SSH.
"""
[manual_steps.verify]
cmd = "gh auth status --hostname {{ github.host }}"
expect = { exit = 0, stdout_regex = "Logged in to" }
unblocks = ["gh-auth"]

[[manual_steps]]
id = "ssh-key"
title = "Register an SSH key with GitHub"
once_per = "machine"
needs = ["browser"]
minutes = 2
why = "Clones and pushes use SSH; gh has the admin:public_key scope only so it can upload the key."
how = """
`ssh-keygen -t ed25519 -C "{{ identity.email }}" -f ~/.ssh/id_ed25519` (accept the defaults; skip
if you already have a key), then `gh ssh-key add ~/.ssh/id_ed25519.pub --title "$(hostname)"`.
Without that scope: {{ github.host }} → **Settings → SSH and GPG keys → New SSH key** → paste
`~/.ssh/id_ed25519.pub`.
"""
[manual_steps.verify]
cmd = "ssh -o BatchMode=yes -o ConnectTimeout=10 -T git@{{ github.host }} 2>&1 | grep -q 'successfully authenticated'"
expect = { exit = 0 }
unblocks = ["gh-ssh"]

[[manual_steps]]
id = "agent-labels"
title = "Create the agent-* labels in repos you will work in (optional, per repo)"
once_per = "org"
needs = []
minutes = 1
why = "The label gate needs the labels to exist; the skills create them on first use (`gh label create agent-*` is promptless), org-wide defaults avoid even that."
how = """
Per repo: `gh label create {{ core.agent_labels.worked }} -R owner/repo -c 7057ff -d 'Worked by an AI agent'`
(and `{{ core.agent_labels.created }}`, `{{ core.agent_labels.drafted }}`). Org admins can add them to the
organisation's default repository labels instead.
"""
[manual_steps.verify]
cmd = "true"
expect = { exit = 0 }

[[manual_steps]]
id = "gh-stack-extension"
title = "Install the gh stack extension at the pinned version (optional)"
once_per = "machine"
needs = []
minutes = 1
why = "work-ticket can link its stacked sub PRs into a native GitHub stack with `gh stack link`. Agents never install extensions (the guard asks on `gh extension install`); the pin keeps the extension at the version the guard rules and the skills were written against. Without it stacks are delivered exactly as before, as plain PRs on the ticket branch."
how = """
1. In a terminal (inside Claude Code type `! ` first):
   `gh extension install github/gh-stack --pin v{{ github.stack_extension_version }}`
2. A pinned extension is skipped by `gh extension upgrade`. To move to another version, change
   `github.stack_extension_version` in harness.toml first, run `harness apply`, then
   `gh extension remove stack` and install again with the new `--pin`.
3. Linking also needs native stacks to be available on the repository; the work-ticket
   preflight reports it as `gh_stack.repo_enabled` (false when the Stacks API answers 404).
"""
[manual_steps.verify]
cmd = '''GH_FORCE_TTY= NO_COLOR=1 GH_PROMPT_DISABLED=1 gh extension list 2>/dev/null | awk -F'\t' '$1 == "gh stack" && $2 == "github/gh-stack" && $3 == "v{{ github.stack_extension_version }}" { f = 1 } END { exit !f }''''
expect = { exit = 0 }
unblocks = ["gh-stack-extension"]

[[doctor_checks]]
id = "gh-binary"
title = "gh installed"
severity = "fail"
cmd = "gh --version"
expect = { exit = 0 }
offline_skip = false
fix = "install-gh"

[[doctor_checks]]
id = "gh-auth"
title = "gh authenticated to {{ github.host }}"
severity = "fail"
cmd = "GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 gh auth status --hostname {{ github.host }}"
expect = { exit = 0, stdout_regex = "Logged in to" }
timeout = 10
offline_skip = true
fix = "gh-auth"

[[doctor_checks]]
id = "gh-ssh"
title = "SSH to {{ github.host }} works"
severity = "warn"
cmd = "ssh -o BatchMode=yes -o ConnectTimeout=10 -T git@{{ github.host }} 2>&1 | grep -q 'successfully authenticated'"
expect = { exit = 0 }
timeout = 15
offline_skip = true
fix = "ssh-key"

[[doctor_checks]]
id = "gh-token-mode"
title = "gh hosts.yml is private (0600)"
severity = "warn"
cmd = "test ! -e ~/.config/gh/hosts.yml || [ \"$(stat -c %a ~/.config/gh/hosts.yml 2>/dev/null || stat -f %Lp ~/.config/gh/hosts.yml)\" = 600 ]"
expect = { exit = 0 }
offline_skip = false
fix = "chmod 600 ~/.config/gh/hosts.yml"

[[doctor_checks]]
id = "gh-stack-extension"
title = "gh stack extension absent or at the pinned v{{ github.stack_extension_version }}"
severity = "warn"
cmd = '''
want='{{ github.stack_extension_version }}'
out=$(GH_FORCE_TTY= NO_COLOR=1 GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 gh extension list 2>&1) || { printf 'gh extension list failed: %s\n' "$out" | head -1; exit 1; }
repo=$(printf '%s\n' "$out" | awk -F'\t' '$1 == "gh stack" { print $2; exit }')
have=$(printf '%s\n' "$out" | awk -F'\t' '$1 == "gh stack" { print $3; exit }')
if [ -z "$repo" ]; then echo "not installed (optional; gh extension install github/gh-stack --pin v$want)"; exit 0; fi
if [ "$repo" != github/gh-stack ]; then echo "gh stack is $repo, not github/gh-stack (gh extension remove stack, then gh extension install github/gh-stack --pin v$want)"; exit 1; fi
if [ "$have" = "v$want" ]; then echo "$have"; exit 0; fi
echo "installed at ${have:-an unknown version}, expected v$want (gh extension remove stack, then gh extension install github/gh-stack --pin v$want)"; exit 1
'''
expect = { exit = 0 }
timeout = 10
offline_skip = false
fix = "gh-stack-extension"

[uninstall]
keeps = ["~/.config/gh/**"]
notes = "Removes ~/.local/bin/gh only if the hub state records that the hub installed it."

# Component taxonomy (docs/reference/taxonomy.md): bundle defaults, then per-component overrides.
[taxonomy]
domain = "scm"
posture = "label-gated"
function = "govern"

[taxonomy.components]
"guard.d/41-github-closing" = { domain = "tracker" }

# Guides steer the agent before it acts; sensors detect at or after the action (principle 6).
[harness]
coverage_note = "Forks: the guard cannot read labels on a fork, so edits there ask instead of being label-gated. A PR created without -t (title from the commit or an editor) is not title-checked. The github-closing guard section enforces rule text that lives in rules/60-github.md. gh stack: the guard knows the gh-stack v0.3.0 command set and sees gh stack, gh extension exec [--] stack, gh-stack (also .exe) and the default gs wrapper of gh stack alias, but not a wrapper under another name (gh stack alias NAME is a human decision). To find the trunk it runs the extension itself (gh stack view --json, in the command's cwd, 8 s timeout; that call also refreshes the extension's local PR state); a failed or unrecognised lookup asks instead of allowing."
guides = [
  { kind = "rule", ref = "rules/60-github.md", checks = ["guard.d/41-github-closing.sh", "guard.d/60-github.sh"], note = "PR-based delivery, merges and PR/issue state on explicit main-thread request only, -R owner/repo on every call" },
  { kind = "permission", ref = "permissions.toml", checks = ["guard.d/60-github.sh", "permissions-vs-guard"], note = "read-only gh commands allowed; token printing denied" },
]
sensors = [
  { kind = "guard", ref = "guard.d/41-github-closing.sh", note = "denies closing keywords that would change issue state; lets only the PR to the default branch close its agent-worked #N in a github-issues repository (github.close_issue_on_merge)" },
  { kind = "guard", ref = "guard.d/60-github.sh", note = "token printing, API writes, merges/reviews and PR/issue state (main thread asks, subagent denied), provenance labels, stacked PR targets; gh stack merge (human decision), gh stack link (label-gated -sub- PR numbers onto the ticket branch), gh stack push|submit|sync|... (deny on the default branch, else ask); PR creates with --fill* or a -t title matching github.pr_title_forbid_re ask" },
  { kind = "doctor", ref = "doctor_checks", note = "gh binary, auth, SSH, token file mode and the gh stack extension version (absent passes, another version warns)" },
  { kind = "test", ref = "guard.d/tests.sh", note = "guard rows with a stubbed gh" },
  { kind = "test", ref = "tests/run.sh", note = "this bundle's rows against core + github only" },
  { kind = "lint", ref = "permissions-vs-guard", note = "each Bash allow/deny rule of permissions.toml run through the guard: no allowed command the guard denies or asks, no denied one it allows" },
]
