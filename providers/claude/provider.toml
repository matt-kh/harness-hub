# Claude Code (Anthropic). Verified locally against Claude Code 2.1.x (2026-09-30).
# Product features a bundle may declare as `provider-feature` sensors ([harness] sensors,
# ref "claude:<feature>"); harness lint checks refs against this list.
features = ["auto-mode-classifier", "permission-prompt"]

[provider]
name = "claude"
summary = "Claude Code CLI"
binary = "claude"
version_cmd = "claude --version"
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'
min_version = "2.0.0"
home = "~/.claude"
verified = "Claude Code 2.1.x, 2026-09-30 (local)"
docs = "docs/providers/claude.md"

# Name collisions with a repository's .claude/ (principle 8; read by `harness repo`): a personal
# skill shadows a project skill of the same name, a project sub-agent wins over a personal one.
[precedence]
skills = "user"
agents = "project"
repo_dir = ".claude"
skill_override_hint = '"skillOverrides": {"<name>": "off"}'

[targets]
instructions = { path = "~/.claude/CLAUDE.md", mode = "managed-block" }
skills       = { path = "~/.claude/skills/<name>", mode = "dir" }
agents       = { path = "~/.claude/agents/<name>.md", mode = "file" }
permissions  = { mode = "settings", key = "permissions" }
trust        = { mode = "settings", key = "autoMode.environment" }
mcp          = { mode = "json-merge", path = "~/.claude.json", key = "mcpServers", entry = { type = "stdio" } }

[targets.settings]
path = "~/.claude/settings.json"
mode = "json-merge"
owner_keys = ["hooks", "permissions", "env", "autoMode"]
sort_arrays = ["permissions.allow", "permissions.ask", "permissions.deny"]
exclusive = [["permissions.allow", "permissions.ask", "permissions.deny"]]

[targets.hooks]
path = "~/.claude/hooks"
mode = "dir"
event = "PreToolUse"
matcher = "Bash"
shim = ""                      # Claude speaks the guard's neutral envelope natively (guard only)
register = "settings"
entry = '{"matcher": "{matcher}", "hooks": [{"type": "command", "command": "{command}"}]}'

# Neutral hook events beyond the guard (bundle [[provides.hooks]]; ARCHITECTURE §5). Claude's
# payloads are the neutral envelope; shim-event.sh only drops transcript_path and
# last_assistant_message on the way in and allow-lists the output (systemMessage, and
# additionalContext on UserPromptSubmit), because Claude adds plain UserPromptSubmit stdout to the
# model's context and honours decision/continue/reason. Matchers are ignored; timeouts in seconds.
[targets.hooks.events.prompt]
name = "UserPromptSubmit"
shim = "shim-event.sh"
entry = '{"hooks": [{"type": "command", "command": "{command}", "timeout": {timeout}}]}'

[targets.hooks.events.stop]
name = "Stop"
shim = "shim-event.sh"
note = "systemMessage only; does not run when you interrupt the agent"
entry = '{"hooks": [{"type": "command", "command": "{command}", "timeout": {timeout}}]}'

[capabilities]
hook_enforced = true
permissions = "native"
ask = true
skills = "native"
agents = "native"
mcp = "native"
instructions = "native"
