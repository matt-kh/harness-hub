# Gemini CLI (Google). Written to the published hooks/skills spec; verify on install.
# Product features a bundle may declare as `provider-feature` sensors ([harness] sensors,
# ref "gemini:<feature>"); harness lint checks refs against this list.
features = []

[provider]
name = "gemini"
summary = "Gemini CLI"
binary = "gemini"
version_cmd = "gemini --version"
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)'
min_version = "0.26.0"
home = "~/.gemini"
verified = "verify on install (written to the published spec, 2026-09)"
docs = "docs/providers/gemini.md"

[targets]
instructions = { path = "~/.gemini/GEMINI.md", mode = "managed-block" }
skills       = { path = "~/.gemini/skills/<name>", mode = "dir" }
agents       = { mode = "inline", note = "no sub-agent files; agent bodies become sections of GEMINI.md" }
permissions  = { mode = "unsupported", note = "permission lists are not translated; the guard hook enforces shell rules" }
trust        = { mode = "unsupported" }
mcp          = { mode = "json-merge", path = "~/.gemini/settings.json", key = "mcpServers" }

[targets.settings]
path = "~/.gemini/settings.json"
mode = "json-merge"
owner_keys = ["hooks", "mcpServers"]

[targets.hooks]
path = "~/.gemini/hooks"
mode = "dir"
event = "BeforeTool"
matcher = "run_shell_command"
shim = "shim.sh"
register = "settings"
entry = '{"matcher": "{matcher}", "hooks": [{"type": "command", "name": "harness-guard", "command": "{command}", "timeout": 20000}]}'

# Neutral hook events beyond the guard (bundle [[provides.hooks]]; ARCHITECTURE §5). The shims
# translate Gemini's payload to the neutral envelope and the hook's output back; Gemini parses
# hook stdout as one JSON object, so the shims print that object or nothing, and never a
# decision. Timeouts are milliseconds. Written to the published spec; verify on install.
[targets.hooks.events.prompt]
name = "BeforeAgent"
shim = "shim-prompt.sh"
timeout_unit = "ms"
entry = '{"hooks": [{"type": "command", "name": "harness-{hook}", "command": "{command}", "timeout": {timeout}}]}'

[targets.hooks.events.stop]
name = "AfterAgent"
shim = "shim-stop.sh"
timeout_unit = "ms"
note = "runs after every turn, not once per session"
entry = '{"hooks": [{"type": "command", "name": "harness-{hook}", "command": "{command}", "timeout": {timeout}}]}'

[capabilities]
hook_enforced = true
permissions = "advisory"
ask = false
skills = "native"
agents = "inlined"
mcp = "native"
instructions = "native"
notes = "no 'ask' decision: guard asks map to [providers.gemini].ask_as (default deny)"
