name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` so a stack part retargeted to the default branch gets its full run without a push
    # (the test job ignores every other edit)
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  # called by release.yml (job checks) so a release runs the same suite; secrets: inherit there
  workflow_call:

permissions:
  contents: read

concurrency:
  # Body/title edits (`stk sync` rewrites the main PR's Stack table) get their own group, so they
  # never cancel an in-progress full run; a base change counts as a run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && 'edit' || 'run' }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  HARNESS_OFFLINE: "1"
  CI_CONFIG: tests/fixtures/harness.ci.toml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck (standalone scripts)
        # Guard fragments (engine.sh, engine-flush.sh, guard.d/NN-*.sh) are not standalone scripts:
        # they are checked below as the concatenated guard. Goldens are generated artefacts.
        run: |
          git ls-files -z -- '*.sh' bin/harness bootstrap \
            | grep -zvE '(^|/)guard\.d/[0-9]+-[^/]+\.sh$|(^|/)guard/engine(-flush)?\.sh$|(^|/)tests/golden/' \
            | xargs -0 -r shellcheck -S warning
      - name: shellcheck (concatenated guard, all bundles)
        run: |
          out="$(mktemp -d)/guard-bash.sh"
          bash bundles/core/guard/build.sh "$out"
          shellcheck -S warning "$out"
      - name: bash -n
        run: |
          rc=0
          while IFS= read -r -d '' f; do bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }; done \
            < <(git ls-files -z -- '*.sh' bin/harness bootstrap)
          exit $rc
      - name: py_compile
        run: git ls-files -z -- '*.py' | xargs -0 -r python3 -m py_compile
      - name: harness lint
        run: bin/harness lint
      - name: Markdown links
        run: tools/gate/check-links.sh

  test:
    # The full suites run on PRs to the default branch, pushes, dispatches and release calls
    # (workflow_call keeps the caller's event) only: stack parts (PRs into a ticket branch or
    # another part) run the fast jobs, and the main PR tests the integrated stack. A sub branch
    # gets a full run on demand with `gh workflow run ci.yml --ref <branch>`.
    if: >-
      (github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch)
      && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor (3.9) is tested where it is a real system python, the stock macOS
        # /usr/bin/python3, not as a setup-python build (none exists for current Ubuntu images,
        # 3.9 is end-of-life upstream). Ubuntu covers the common distro python and the newest
        # release.
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.15"
          - os: macos-latest
            python: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Use the stock python3 (macOS /usr/bin/python3)
        if: matrix.python == 'system'
        env:
          FLOOR: "3.9"   # bundles/core/bundle.toml min_version; keep in step
        run: |
          # The runner image puts Homebrew's python3 first on PATH; shim the system one ahead of it.
          shim="$RUNNER_TEMP/python-shim"
          mkdir -p "$shim"
          ln -sf /usr/bin/python3 "$shim/python3"
          echo "$shim" >> "$GITHUB_PATH"
          v="$("$shim/python3" -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "stock python3: $("$shim/python3" --version 2>&1)"
          if ! "$shim/python3" -c "import sys; sys.exit(0 if sys.version_info[:2] >= tuple(map(int, '$FLOOR'.split('.'))) else 1)"; then
            echo "::error::stock python3 $v is below the supported floor $FLOOR"; exit 1
          fi
          if [ "$v" != "$FLOOR" ]; then
            echo "::warning::stock macOS python3 is now $v, the floor is $FLOOR: nothing tests $FLOOR any more; raise the floor (bundles/core/bundle.toml, bin/harness, docs) or add a $FLOOR row"
          fi
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bash jq shellcheck
      - name: bash 3.2 syntax gate (macOS /bin/bash)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          rc=0
          while IFS= read -r -d '' f; do /bin/bash -n "$f" || { echo "::error file=$f::/bin/bash (3.2) cannot parse"; rc=1; }; done \
            < <(git ls-files -z -- '*.sh' bin/harness bootstrap)
          exit $rc
      - name: Gate self-test
        run: tools/gate/tests/selftest.sh
      - name: Companion gate self-test
        run: tools/gate/tests/companions-selftest.sh
      - name: harness test
        run: |
          python3 --version
          bin/harness test --jobs auto
      - name: Bootstrap from the entry point (temp HOME, fake CLIs)
        run: |
          HOME="$(cd "$(mktemp -d)" && pwd)"; export HOME   # normalised (macOS $TMPDIR ends in /)
          export PATH="$PWD/tests/fakes/bin:$PATH"
          ./bootstrap --bundles core --providers claude --yes --offline --config "$CI_CONFIG"
          bin/harness doctor --offline --config "$CI_CONFIG"
          bin/harness plan --config "$CI_CONFIG" | tee /tmp/plan.txt
          grep -q '0 changes' /tmp/plan.txt

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Private-identifier gate
        env:
          # Empty on pull requests from forks: the gate then runs the public patterns only.
          GATE_PRIVATE_DENYLIST: ${{ secrets.GATE_PRIVATE_DENYLIST }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--ci)
          if [ -z "$GATE_PRIVATE_DENYLIST" ]; then
            echo "private list unavailable (fork pull request or secret not set): public patterns only"
          fi
          if [ -n "$RANGE_BASE" ] && ! printf '%s' "$RANGE_BASE" | grep -qE '^0+$' \
             && git cat-file -e "$RANGE_BASE^{commit}" 2>/dev/null; then
            args+=(--range "$RANGE_BASE..$RANGE_HEAD")
          else
            echo "no usable commit range for this event: scanning the tree only"
          fi
          tools/gate/private-ids.sh "${args[@]}"
      - name: Companion-file gate (guard rows, CHANGELOG, README, issue reference)
        if: github.event_name == 'pull_request'
        env:
          # The body reaches the script through a file, never interpolated into this script:
          # markers `no-rows: <reason>` / `no-changelog: <reason>` may sit there or in a commit body.
          PR_BODY: ${{ github.event.pull_request.body }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
          # "true" when the PR targets the default branch: check `issue` then lets it close its own
          # issue (the bare #N of its `Issue: #N` line); sub-PRs stay mention-only.
          BASE_IS_DEFAULT: ${{ github.base_ref == github.event.repository.default_branch }}
        run: |
          printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pr-body.txt"
          args=(--ci --range "$RANGE_BASE..$RANGE_HEAD" --markers-file "$RUNNER_TEMP/pr-body.txt")
          if [ "$BASE_IS_DEFAULT" = true ]; then args+=(--base-is-default); fi
          tools/gate/companions.sh "${args[@]}"
      - name: detect-secrets
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "no .secrets.baseline yet: skipping detect-secrets"
            exit 0
          fi
          pip install --quiet detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated doc regions are current
        run: bin/harness docs check
      - name: Render twice with the same fresh home
        # Same HOME on purpose: hook commands are absolute paths (hooks do not expand ~), so
        # determinism means repeatability for one home, not identity across homes.
        run: |
          h=$(mktemp -d)
          HOME="$h" bin/harness render --config "$CI_CONFIG" --out /tmp/r1
          HOME="$h" bin/harness render --config "$CI_CONFIG" --out /tmp/r2
      - name: Render output is byte-identical
        run: diff -r /tmp/r1 /tmp/r2
